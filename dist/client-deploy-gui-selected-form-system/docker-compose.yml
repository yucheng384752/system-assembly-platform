# Generated by Form System Kit Composer - Recipe: gui-selected-form-system
#
# Quick start:
#   cp .env.docker .env && nano .env   # set DB_PASSWORD, SECRET_KEY, ADMIN_API_KEYS
#   docker compose up -d
#   open http://localhost

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-form_db}
      POSTGRES_USER: ${DB_USER:-form_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-form_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql+asyncpg://${DB_USER:-form_user}:${DB_PASSWORD:-changeme}@db:5432/${DB_NAME:-form_db}"
      SECRET_KEY: ${SECRET_KEY:-changeme-replace-before-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      AUTH_MODE: ${AUTH_MODE:-api_key}
      ADMIN_API_KEYS: ${ADMIN_API_KEYS:-changeme-replace-before-production}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    ports:
      - "8000:8000"
    # TPM 2.0 machine binding — pass through the kernel TPM resource manager device.
    # Remove this block if the host has no TPM chip; license.py will fall back to /etc/machine-id.
    devices:
      - /dev/tpmrm0:/dev/tpmrm0
    group_add:
      - tss
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db-data: